<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 40px auto;
        padding: 0 20px;
      }

      h1 {
        margin-bottom: 20px;
      }

      .post {
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
        margin-bottom: 10px;
        transition: 0.2s;
      }

      .post:hover {
        background: #f9f9f9;
      }

      a {
        text-decoration: none;
        color: #333;
      }

      .date {
        font-size: 12px;
        color: gray;
      }
    </style>
  </head>

  <body>
    <h1>Pieblog</h1>
    <a
      href="{% url 'post_create' %}"
      style="display: block; margin-bottom: 20px; color: blueviolet"
      >+ Write New Post</a
    >

    {% for post in posts %}
    <div class="post">
      <a href="{% url 'post_detail' post.id %}">
        <h2>{{ post.title }}</h2>
      </a>
      <div class="date">{{ post.created_at }}</div>
      <p>{{ post.content|truncatewords:20 }}</p>
    </div>
    {% empty %}
    <p>No posts yet.</p>
    {% endfor %}
  </body>
</html>
